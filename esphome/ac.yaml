substitutions:
  name: ac  # device name
  friendly_name: AC  
  remote_temp_sensor: sensor.thermostat_actual_temperature  # external temperature sensor
  remote_dewpoint_sensor: sensor.thermostat_dew_point  # external dewpoint sensor (used for dry mode)
  temp_offset: 0.0  # temperature offset added to external sensor readings (My AC cools to 1°C below the set temperature so I set this to -0.5)
  api_key: "5NPD5ZrHBdZ8N1r60qwq8+gZfK6wUh1ccB4uV7eUhDU="  # randomly generated key. Make sure to use your own... or not... I'm not your mom... 

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Dummy device
  project:
    name: Qetesh.CN105-Controller
    version: 1.0.0

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

# External component reference
external_components:
  - source: github://echavet/MitsubishiCN105ESPHome
    
logger:
  level: INFO
  logs:
    EVT_SETS: INFO
    WIFI: INFO
    MQTT: INFO
    WRITE_SETTINGS: INFO
    SETTINGS: INFO
    STATUS: INFO
    CN105Climate: WARN
    CN105: INFO
    climate: WARN
    sensor: WARN
    chkSum: INFO
    WRITE: WARN
    READ: WARN
    Header: INFO
    Decoder: INFO
    CONTROL_WANTED_SETTINGS: INFO

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} ESP
    password: "WiFiPassword"

captive_portal:

sensor:
  # Uptime sensor.
  - platform: uptime
    name: Uptime

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s

  - platform: homeassistant
    name: "Remote Temperature Sensor"
    entity_id: ${remote_temp_sensor}
    id: ha_remote_temp
    internal: true
    force_update: true
    on_value:
      then:
        - lambda: id(ha_effective_temp).update();

  - platform: homeassistant
    name: "Remote Dewpoint Sensor"
    entity_id: ${remote_dewpoint_sensor}
    id: ha_remote_dewpoint
    internal: true
    force_update: true
    on_value:
      then:
        - lambda: id(ha_effective_temp).update();

  - platform: template
    name: "Effective Temperature Value"
    id: ha_effective_temp
    internal: false
    entity_category: diagnostic
    force_update: false
    unit_of_measurement: "°C"
    device_class: temperature
    lambda: |-
      if (id(hp).mode == climate::CLIMATE_MODE_DRY) {
        ESP_LOGI("virtualsensor", "ha_effective_temp update using dewpoint");
        return id(ha_remote_dewpoint).state + 10.0f;
      } else {
        ESP_LOGI("virtualsensor", "ha_effective_temp update using temperature");
        return id(ha_remote_temp).state;
      }
    filters:
      - offset:
          ${temp_offset}

# Enable Web server.
web_server:
  port: 80

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID

# Create a button to restart the unit from HomeAssistant. Rarely needed, but can be handy.
button:
  - platform: restart
    name: "Restart ${friendly_name}"

# Do not change the uart settings!    
uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO11
  rx_pin: GPIO10

# Climate entity configuration
climate:
  - platform: cn105
    id: hp
    on_state:
      then:
        - lambda: |
            static climate::ClimateMode last_mode = climate::CLIMATE_MODE_OFF;
            if (x.mode != last_mode) {
              ESP_LOGI("virtualsensor", "cn105 climate mode changed to %s", LOG_STR_ARG(climate::climate_mode_to_string(x.mode)));
              last_mode = x.mode;
              id(ha_effective_temp).update();
            }
    name: "${friendly_name}"
    update_interval: 2s # update interval can be adjusted after a first run and logs monitoring
    remote_temperature_source:
      sensor_id: ha_effective_temp       # References the sensor declared above
      info:                           # Optional: exposes a text sensor showing the source name
        name: Temp Source
    remote_temperature_timeout: 30min # Fallback to internal sensor after 30 min without HA updates
    remote_temperature_keepalive_interval: 20s # Re-send temperature every 20s (like Kumo does)
    outside_air_temperature_sensor:
      name: Outside Air Temp
      disabled_by_default: false
    vertical_vane_select:
      name: Vertical Vane
      disabled_by_default: false
    horizontal_vane_select:
      name: Horizontal Vane
      disabled_by_default: true
    stage_sensor:
      name: Stage
      # use_as_operating_fallback: false     # set to true for 2-stage systems or if activity indicator is unreliable
      entity_category: diagnostic
      disabled_by_default: false
    sub_mode_sensor:
      name: Sub Mode
      entity_category: diagnostic
      disabled_by_default: false
    auto_sub_mode_sensor:
      name: Auto Sub Mode
      entity_category: diagnostic
      disabled_by_default: false
    input_power_sensor:
      name: Input Power
      disabled_by_default: false
    kwh_sensor:
      name: Energy Usage
      disabled_by_default: false
    runtime_hours_sensor:
      name: Runtime Hours
      entity_category: diagnostic
      disabled_by_default: false
    air_purifier_switch:
      name: Air purifier
      disabled_by_default: true
    night_mode_switch:
      name: Night mode
      disabled_by_default: false
    supports:
      # Explicitly control dual setpoint support in the UI/traits
      # Defaults to false when omitted
      dual_setpoint: false
      # You can still specify supported modes as before
      mode: [COOL, HEAT, DRY, FAN_ONLY]
      fan_mode: [AUTO, QUIET, LOW, MEDIUM, HIGH]
      #swing_mode: ["OFF", VERTICAL]
      # Specify which options to display in horizontal_vane_select dropdown
      # Defaults to all options: ["←←", "←", "|", "→", "→→", "←→", "SWING", "AIRFLOW CONTROL"]
      # Example to hide "←→" and "AIRFLOW CONTROL" if not supported by your unit:
      horizontal_vane_mode: ["←←", "←", "|", "→", "→→", SWING]      
    hardware_settings:
      # update_interval: 20s
      list:
        # Code 101: Auto Restart
        - code: 101
          name: "Auto Restart after Power Failure"
          icon: "mdi:restart"
          entity_category: CONFIG
          options:
            1: "ON (Default)"
            2: "OFF"
        # Code 102: Temperature Sensing Source
        # Important for remote temperature control!
        - code: 102
          name: "Temperature Source"
          icon: "mdi:thermometer-check"
          entity_category: CONFIG
          options:
            1: "Indoor Unit (Default)"
            # 2: "Remote Controller"
            3: "External (CN105/WiFi)"
        # Code 108: Ceiling Height / Static Pressure
        - code: 108
          name: "Ceiling Height Mode"
          icon: "mdi:arrow-expand-vertical"
          entity_category: CONFIG
          options:
            1: "Standard (Default)"
            2: "High Ceiling"
            3: "Low Ceiling"


# Add status led
status_led:
  pin:
    number: GPIO22
    inverted: true

# BT proxy for use with other stuff. Remove if you don't need it.
bluetooth_proxy:
  active: true
